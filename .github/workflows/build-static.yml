name: Build static blog pages

on:
  push:
    branches: [main]
    paths:
      - 'script.js'
      - 'scripts/build-static-blog.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate blog/<slug>/index.html and sitemap.xml
        run: node scripts/build-static-blog.cjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml .nojekyll
          git diff --cached --quiet || git commit -m "Auto-generate static blog pages and sitemap"
          git push
